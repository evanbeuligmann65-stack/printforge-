name: Unpack PrintForge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack website
        run: |
          mkdir unpacked
          unzip -q printforge_fullstack.zip -d unpacked
          cp -R unpacked/printforge_fullstack/. .
          rm -rf unpacked
          rm -f printforge_fullstack.zip
          rm -f .github/workflows/unpack.yml

      - name: Save website files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Set up PrintForge website [skip ci]" || exit 0
          git push
